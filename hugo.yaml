baseURL: https://blog.pietrasy.org/
locale: 'en-us'
title: Piotr's Place
theme: PaperMod
params:
  author: Piotr Pietraszkiewicz
  email: ppietrasa@gmail.com
  homeInfoParams:
    Title: Piotr Pietraszkiewicz
    Content: Sharing my notes, documenting my learning and practicing writing
  socialIcons:
    - name: "Github"
      url: "https://github.com/ppietrasa"
    - name: "Linkedin"
      url: "https://www.linkedin.com/in/piotr-pietraszkiewicz/"

buildDrafts: false
buildFuture: true
buildExpired: true

module:
  mounts:
  - source: content
    target: content
  - source: /home/piotr/notes/home/Output/Blog
    target: content/posts

mainSections:
  - posts
  - aboutme

menu:
  main:
    - identifier: About
      name: "About"
      url: /aboutme/
      weight: 10
    - identifier: Tags
      name: Tags
      url: /tags/
      weight: 20
    - identifier: "Index"
      name: "Index"
      url: /archives/
      weight: 30
    - identifier: Search
      name: 🔍
      url: /search/
      weight: 50


# enable search
outputs:
  home:
    - HTML
    - RSS
    - JSON # necessary for search

markup:
  defaultMarkdownHandler: goldmark
  goldmark:
    extensions:
      footnote: true
